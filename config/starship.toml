add_newline = true

format = """
[╭─](bold blue)$username$hostname$directory$git_branch$git_status$nix_shell$cmd_duration
[╰─](bold blue)$character"""

[username]
show_always = true
style_user = "bold purple"
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "[@$hostname](bold cyan) "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "⎇ "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nix_shell]
symbol = "❄ "
style = "bold cyan"
format = '[$symbol$state]($style) '

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[⏱ $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
